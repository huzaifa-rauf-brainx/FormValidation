<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Form Validation</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <link rel="stylesheet" href="assets/CSS/index.css">
</head>
<body class="d-flex justify-content-center">
    <main class="container d-flex justify-content-center ">
        <form class="main-container col-12 col-md-4 px-3 px-md-0 mt-5" method="POST"
            onsubmit="successfulSubmit()" novalidate>
            <fieldset>
                <legend class="text-center">User Registration</legend>
                <!-- First Name -->
                <div class="mb-3">
                    <label for="firstName" class="form-label">First Name</label>
                    <input type="text" class="form-control" id="firstName" required
                        aria-required="true">
                    <div class="text-danger small" id="firstNameError"></div>
                </div>
                <!-- Last Name -->
                <div class="mb-3">
                    <label for="lastName" class="form-label">Last Name</label>
                    <input type="text" class="form-control" id="lastName" required
                        aria-required="true">
                    <div class="text-danger small" id="lastNameError"></div>
                </div>
                <!-- Age -->
                <div class="mb-3">
                    <label for="age" class="form-label">Age</label>
                    <input type="number" class="form-control" id="age" required
                        aria-required="true">
                    <div class="text-danger small" id="ageError"></div>
                </div>
                <!-- Email -->
                <div class="mb-3">
                    <label for="notificationEmail" class="form-label">Notification Email(s)</label>
                    <input type="text" class="form-control" id="notificationEmail" required
                        aria-required="true">
                    <div class="text-danger small" id="notificationEmailError"></div>
                </div>
                <!-- Password -->
                <div class="mb-3">
                    <label for="password" class="form-label">Password</label>
                    <input type="password" class="form-control" id="password" required
                        aria-required="true">
                    <div class="text-danger small" id="passwordError"></div>
                </div>
                <!-- Confirm Password -->
                <div class="mb-3">
                    <label for="confirmPassword" class="form-label">Confirm Password</label>
                    <input type="password" class="form-control" id="confirmPassword"
                        required aria-required="true">
                    <div class="text-danger small" id="confirmPasswordError"></div>
                </div>
                <!-- Contact Number -->
                <div class="mb-3">
                    <label for="contactNumber" class="form-label">Contact Number</label>
                    <input type="tel" class="form-control" id="contactNumber" required
                        aria-required="true">
                    <div class="text-danger small" id="contactNumberError"></div>
                </div>
                <!-- CSRF Token -->
                <input type="hidden" name="CSRFToken" value="Token Value">
                <!-- Submit Button -->
                <button type="submit" class="btn btn-primary opacity-50 submit-button" id="submitBtn"
                    disabled>Submit</button>
            </fieldset>
        </form>
    </main>
    <script src="assets/JavaScript/script.js"></script>
</body>
</html>
