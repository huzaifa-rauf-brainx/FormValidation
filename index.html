<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form validation</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <script src="assets/JavaScript/script.js"></script>
</head>
<body class="d-flex justify-content-center">
    <form class="col-12 col-md-4 px-3 px-md-0 d-flex flex-column justify-content-center mt-5" method="POST" onsubmit="successfulSubmit()">
        <!-- First Name Input -->
        <div class="mb-3">
            <label for="firstName" class="form-label">First Name</label>
            <input type="text" class="form-control" id="firstName" aria-describedby="First-Name" onblur="validateFirstName()">
            <div class="text-danger small" id="firstNameError"></div>
        </div>
        <!-- Last Name Input -->
        <div class="mb-3">
            <label for="lastName" class="form-label">Last Name</label>
            <input type="text" class="form-control" id="lastName" aria-describedby="Last-Name" onblur="validateLastName()">
            <div class="text-danger small" id="lastNameError"></div>
        </div>
        <!-- Age Input -->
        <div class="mb-3">
            <label for="age" class="form-label">Age</label>
            <input type="text" class="form-control" id="age" onblur="validateAge()">
            <div class="text-danger small" id="ageError"></div>
        </div>
        <!-- Email Input -->
        <div class="mb-3">
            <label for="notificationEmail" class="form-label">Notification Email(s)</label>
            <input type="text" class="form-control" id="notificationEmail" autocomplete="on" onblur="validateEmails()">
            <div class="text-danger small" id="emailError"></div>
        </div>
        <!-- Password Input -->
        <div class="mb-3">
            <label for="password" class="form-label">Password</label>
            <input type="password" class="form-control" id="password" onblur="validatePassword()">
            <div class="text-danger small" id="passwordError"></div>
        </div>
        <!-- Confirm Password Input -->
        <div class="mb-3">
            <label for="confirmPassword" class="form-label">Confirm Password</label>
            <input type="password" class="form-control" id="confirmPassword" onblur="validateConfirmPassword()">
            <div class="text-danger small" id="confirmPasswordError"></div>
        </div>
        <!-- Contact Number Input -->
        <div class="mb-3">
            <label for="contactNumber" class="form-label">Contact Number</label>
            <input type="text" class="form-control" id="contactNumber" onblur="validateContactNumber()">
            <div class="text-danger small" id="contactNumberError"></div>
        </div>
        <!-- Submit Button -->
        <button type="submit" class="btn btn-outline-primary" id="submitBtn" disabled>Submit</button>
    </form>
</body>
</html>
